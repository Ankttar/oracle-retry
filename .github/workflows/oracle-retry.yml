name: Oracle Retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar si ya hay éxito
        id: gate
        run: |
          if [ -f SUCCESS.md ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar OCI CLI
        if: steps.gate.outputs.skip == 'false'
        run: pip install oci-cli

      - name: Configurar credenciales OCI
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p "$HOME/.oci" "$HOME/.ssh"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" | tr -d '\r' > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 "$HOME/.oci/config"
          printf '%s' "${{ secrets.SSH_PUBLIC_KEY }}" | tr -d '\r' > "$HOME/.ssh/oracle_cloud_ssh_key.pub"

      - name: DEBUG clave (temporal, sin exponer contenido sensible)
        if: steps.gate.outputs.skip == 'false'
        run: |
          echo "Primeros 3 bytes en hex (detecta BOM, ef bb bf = BOM UTF-8):"
          head -c 3 "$HOME/.oci/key.pem" | od -An -tx1
          echo "Longitud de cada línea:"
          awk '{ print NR": "length($0)" caracteres" }' "$HOME/.oci/key.pem"
          echo "Dump hexadecimal de la primera línea completa:"
          sed -n '1p' "$HOME/.oci/key.pem" | od -An -c | head -5
          echo "Dump hexadecimal de la última línea completa:"
          tail -n 1 "$HOME/.oci/key.pem" | od -An -c | head -5
          echo "Verificación openssl pkey:"
          openssl pkey -in "$HOME/.oci/key.pem" -noout -text 2>&1 | head -n 5 || true

      - name: Reintentar creación de instancia
        if: steps.gate.outputs.skip == 'false'
        env:
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
        run: bash oracle_retry.sh

      - name: Guardar resultado si hubo éxito
        if: steps.gate.outputs.skip == 'false'
        run: |
          if [ -f SUCCESS.md ]; then
            git config user.name "oracle-retry-bot"
            git config user.email "actions@users.noreply.github.com"
            git add SUCCESS.md
            git commit -m "Instancia creada" || echo "nada que commitear"
            git push
          fi
